<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하호동 · 자기소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --mint-bg: #eefbf7;
    --mint-bg-deep: #dff6ee;
    --mint-accent: #2ec4a6;
    --mint-accent-soft: #b7ecdc;
    --teal-deep: #0e4b43;
    --teal-mid: #16665a;
    --ink: #123c35;
    --card: #ffffff;
    --line: #cdf0e2;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--mint-bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    position: relative;
  }

  /* 배경 잔물결 */
  .ripple-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .ripple-bg svg{
    position:absolute;
    width: 100%;
    left: 0;
  }
  .ripple-bg .r1{ bottom: -4%; opacity: 0.55; }
  .ripple-bg .r2{ bottom: -8%; opacity: 0.35; }

  .wrap{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 56px 44px 44px;
    box-shadow: 0 30px 60px -30px rgba(14, 75, 67, 0.25);
    position: relative;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--teal-mid);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .eyebrow::before{
    content:"";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint-accent);
    box-shadow: 0 0 0 4px var(--mint-accent-soft);
  }

  h1{
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: clamp(40px, 8vw, 56px);
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--teal-deep);
    letter-spacing: -0.01em;
  }
  h1 .sub-hanja{
    display:block;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: var(--teal-mid);
    letter-spacing: 0.08em;
    margin-top: 10px;
  }

  .divider{
    width: 44px;
    height: 3px;
    background: var(--mint-accent);
    border-radius: 3px;
    margin: 26px 0 30px;
  }

  .section-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--mint-accent);
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .tags{
    display:flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 34px;
  }
  .tag{
    background: var(--mint-bg-deep);
    color: var(--teal-deep);
    border: 1px solid var(--line);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .brag{
    position: relative;
    background: linear-gradient(135deg, var(--mint-bg-deep), #f5fffb);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 24px 24px;
    overflow: hidden;
  }
  .brag-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--mint-accent);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .brag-text{
    font-size: 17px;
    line-height: 1.65;
    font-weight: 500;
    color: var(--teal-deep);
    margin: 0;
    max-width: 82%;
  }

  .zzz{
    position: absolute;
    font-family: 'Gowun Batang', serif;
    color: var(--mint-accent);
    opacity: 0;
    font-weight: 700;
    user-select: none;
    animation: floatUp 4.5s ease-in infinite;
  }
  .zzz.z1{ right: 26px; bottom: 18px; font-size: 20px; animation-delay: 0s; }
  .zzz.z2{ right: 46px; bottom: 18px; font-size: 26px; animation-delay: 1.1s; }
  .zzz.z3{ right: 70px; bottom: 18px; font-size: 32px; animation-delay: 2.2s; }

  @keyframes floatUp{
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    15%  { opacity: 0.9; }
    100% { transform: translateY(-58px) rotate(-6deg); opacity: 0; }
  }

  .sleep-icon{
    position:absolute;
    right: 24px;
    top: 20px;
    font-size: 22px;
    opacity: 0.9;
  }

  footer{
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: var(--teal-mid);
    letter-spacing: 0.08em;
    opacity: 0.7;
  }

  @media (max-width: 480px){
    .card{ padding: 44px 26px 34px; }
    .brag-text{ max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .zzz{ animation: none; opacity: 0; }
  }
</style>
</head>
<body>

<div class="ripple-bg" aria-hidden="true">
  <svg class="r1" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#2ec4a6" d="M0,120 C240,180 480,60 720,100 C960,140 1200,200 1440,120 L1440,220 L0,220 Z"></path>
  </svg>
  <svg class="r2" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#0e4b43" d="M0,160 C260,100 520,200 760,150 C1000,100 1220,180 1440,140 L1440,220 L0,220 Z"></path>
  </svg>
</div>

<div class="wrap">
  <div class="card">
    <div class="eyebrow">Self Introduction</div>

    <h1>하호동
      <span class="sub-hanja">HA HO DONG</span>
    </h1>

    <div class="divider"></div>

    <div class="section-label">취미</div>
    <div class="tags">
      <span class="tag">📚 독서</span>
      <span class="tag">✈️ 여행</span>
    </div>

    <div class="section-label">자랑</div>
    <div class="brag">
      <span class="sleep-icon">😴</span>
      <p class="brag-text">어느 환경에서도 잘 잘 수 있음</p>
      <span class="zzz z1">Z</span>
      <span class="zzz z2">Z</span>
      <span class="zzz z3">Z</span>
    </div>
  </div>

  <footer>MINT PROFILE · 하호동</footer>
</div>

</body>
